name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, component, and SSR tests
        run: pnpm test:coverage

      - name: Size budgets
        run: pnpm size

      - name: Static graph assertions
        run: pnpm check:graph

      - name: Entry point assertions
        run: pnpm check:entries

      - name: Documentation checks
        run: pnpm check:docs

      - name: Package validation
        run: pnpm check:package

      - name: Consumer fixture (packed tarball)
        run: pnpm check:consumer

      - name: Build docs
        run: pnpm docs:build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
